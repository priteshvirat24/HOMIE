services:
  # === PostgreSQL — using different port to avoid conflict with local postgres ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homie
      POSTGRES_USER: homie
      POSTGRES_PASSWORD: homie_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homie -d homie"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Redis — using different port to avoid conflict with local redis ===
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === S3-compatible storage (SeaweedFS) ===
  # MinIO no longer publishes Docker images, so local dev uses SeaweedFS's S3 gateway on the same
  # port (9000). It accepts any access key in this anonymous dev setup; the API creates the
  # homie-images / homie-scenes buckets on startup.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - "9000:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  s3_data:

