services:
  # === PostgreSQL — using different port to avoid conflict with local postgres ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homie
      POSTGRES_USER: homie
      POSTGRES_PASSWORD: homie_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homie -d homie"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Redis — using different port to avoid conflict with local redis ===
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === MinIO (S3-compatible storage) ===
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === MinIO Bucket Setup ===
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/homie-images --ignore-existing;
      mc mb local/homie-scenes --ignore-existing;
      mc anonymous set download local/homie-scenes;
      echo 'MinIO buckets created successfully';
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:

